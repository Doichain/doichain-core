# Lightweight, self-contained CI for Doichain Core.
#
# Builds the daemon, CLI and unit tests on a stock GitHub-hosted Linux runner
# (no GUI, no multiprocess/IPC), runs the unit test suite and the functional
# name-test suite, and runs the full Bitcoin linters inside their container.
# This gives fast, cheap and reliable feedback on every push/PR; the full
# Bitcoin-Core-style matrix (Linux/macOS/Windows) lives in ci.yml and is better
# suited for a public repository with unlimited Actions minutes.
name: Lean CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: lean-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkgconf python3 ccache \
            libevent-dev libboost-dev libsqlite3-dev

      - name: ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: lean-ci-ccache-${{ github.sha }}
          restore-keys: lean-ci-ccache-

      - name: Configure
        run: >
          cmake -B build
          -DBUILD_GUI=OFF
          -DENABLE_IPC=OFF
          -DBUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Unit tests
        # Full unit suite. The suites that used to be excluded here
        # (pow_tests, script_standard_tests, net_peer_connection_tests,
        # name_mempool_tests, validation_chainstatemanager_tests) have been
        # adapted to Doichain's parameters (powLimit, bech32 HRP, default P2P
        # port, placeholder nMinimumChainWork) and the name-mempool callback
        # race that made name_mempool_tests flaky has been fixed. until-pass:2
        # is kept only to absorb timing noise on shared CI runners.
        run: >
          ctest --test-dir build --output-on-failure --repeat until-pass:2 -j"$(nproc)"

      - name: Functional tests (name suite)
        # End-to-end tests that drive doichaind over RPC on regtest and cover
        # the name / AuxPoW functionality (incl. name_doi). Only
        # name_deterministic_salt is excluded: it needs the legacy-wallet
        # sethdseed RPC, which Bitcoin Core 31 removed along with BDB wallets.
        run: |
          NAMES=$(ls test/functional/name_*.py | xargs -n1 basename \
            | grep -v 'name_deterministic_salt')
          # plus the DigiShield DAA end-to-end test (reset window, bounded valve,
          # relay and low-work headers sync across three nodes)
          NAMES="feature_digishield.py $NAMES"
          # plus rpc_help.py, which renders every RPC's help text. Our own RPCs
          # are the ones likely to break it, and nothing else in this suite
          # calls plain `help`: a name_doi description starting with a newline
          # broke `help` in v31.1.2 through v31.1.5 without CI noticing (#18).
          NAMES="rpc_help.py $NAMES"
          python3 build/test/functional/test_runner.py $NAMES -j"$(nproc)" \
            --tmpdirprefix="${RUNNER_TEMP}/dc-func"

  lint:
    name: Lint (Bitcoin linters)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the linters run commit-range and subtree checks.
          fetch-depth: 0

      - name: Run linters
        # Builds the bitcoin-linter container (ci/lint_imagefile) and runs the
        # full lint suite (ci/lint/06_script.sh) inside it. Docker/buildx are
        # preinstalled on ubuntu-latest; ci/lint.py drops the interactive -it
        # flag automatically when GITHUB_ACTIONS=true.
        run: ci/lint.py
